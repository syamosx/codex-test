name: Download native 480p video
'on':
  push:
    paths:
    - .github/workflows/download-video-480p.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Install merge tools
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
        fi
    - name: Download public native streams and merge without encoding
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import concurrent.futures,json,os,pathlib,subprocess,urllib.request,urllib.parse,urllib.error
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        payload={'url':'https://www.youtube.com/watch?v=8YPub3-TQjU','videoQuality':'480','audioFormat':'best','downloadMode':'auto','youtubeVideoCodec':'h264','youtubeVideoContainer':'mkv','youtubeDubLang':'ar','youtubeBetterAudio':True,'alwaysProxy':True,'localProcessing':'forced'}
        completed=False
        for api in ['https://rue-cobalt.xenon.zone/','https://cobaltapi.cjs.nz/']:
            print('Trying public downloader',urllib.parse.urlsplit(api).hostname,flush=True)
            try:
                request=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Content-Type':'application/json','Cache-Control':'no-cache'},method='POST')
                with urllib.request.urlopen(request,timeout=40) as response:
                    data=json.loads(response.read(100000))
                if data.get('status')!='local-processing' or data.get('type')!='merge':
                    print('Downloader response',data.get('status'),data.get('error',{}).get('code'),flush=True)
                    continue
                urls=data['tunnel']
                assert len(urls)==2
                expected_host=urllib.parse.urlsplit(api).hostname
                for url in urls:
                    parts=urllib.parse.urlsplit(url)
                    assert parts.scheme=='https' and parts.hostname==expected_host
                def download(pair):
                    index,url=pair
                    path=root/('native-stream-'+str(index)+'.bin')
                    request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                    with urllib.request.urlopen(request,timeout=60) as response:
                        with path.open('wb') as output:
                            while chunk:=response.read(1024*1024):
                                output.write(chunk)
                    assert path.stat().st_size>10000,'Empty media download'
                    probe=subprocess.run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(path)],check=True,capture_output=True,text=True)
                    info=json.loads(probe.stdout)
                    print('Downloaded stream',index,'bytes',path.stat().st_size,'codecs',[s['codec_name'] for s in info['streams']],flush=True)
                    return path,info
                with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                    streams=list(pool.map(download,enumerate(urls)))
                video=next(path for path,info in streams if any(s.get('codec_type')=='video' and s.get('height')==480 for s in info['streams']))
                audio=next(path for path,info in streams if any(s.get('codec_type')=='audio' for s in info['streams']))
                output=root/'video_480p_original_audio.mkv'
                subprocess.run(['ffmpeg','-y','-nostdin','-hide_banner','-loglevel','error','-i',str(video),'-i',str(audio),'-map','0:v:0','-map','1:a:0','-c','copy',str(output)],check=True)
                probe=subprocess.run(['ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height:format=duration,size','-of','json',str(output)],check=True,capture_output=True,text=True)
                info=json.loads(probe.stdout)
                assert float(info['format']['duration'])>=1885
                print(probe.stdout,flush=True)
                completed=True
                break
            except Exception as error:
                print('Downloader failed:',type(error).__name__,str(error)[:180],flush=True)
        if not completed:
            raise SystemExit('No public downloader returned valid complete native streams')

        PYTHON
    - name: Save merged video
      uses: actions/upload-artifact@v7
      with:
        name: video-480p-original-audio
        path: ${{ runner.temp }}/video_480p_original_audio.mkv
        compression-level: 0
        retention-days: 3
        if-no-files-found: error
